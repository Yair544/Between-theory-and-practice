<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IncidentIQ &mdash; AI-assisted incident analysis</title>

  <!-- Inline so the app needs no network and no extra route to serve one file. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232358d8'/%3E%3Ctext x='16' y='22' font-family='Segoe UI,Arial' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EIQ%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="./css/theme.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">

  <!-- Applied before first paint so the page never flashes the wrong theme. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("iq.theme"); } catch (e) { /* private mode */ }
      var prefersDark = window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
</head>

<body>
<a class="skip-link" href="#panes">Skip to analysis results</a>

<div class="app">

  <!-- ===================== header ===================== -->
  <header class="app-header">
    <div class="brand">
      <div class="brand__mark" aria-hidden="true">IQ</div>
      <div>
        <div class="brand__name">IncidentIQ</div>
        <div class="brand__tagline">Evidence-first incident analysis</div>
      </div>
    </div>

    <div class="app-header__spacer"></div>

    <div class="app-header__actions">
      <span class="badge" id="provider-badge" title="Which engine produced the current analysis">
        not run yet
      </span>
      <button class="btn btn--ghost btn--sm" id="btn-toggle-sidebar"
              aria-pressed="false" title="Show or hide the input panel">
        Input panel
      </button>
      <button class="btn btn--icon btn--ghost" id="btn-theme"
              title="Switch between light and dark" aria-label="Toggle colour theme">
        &#9789;
      </button>
    </div>
  </header>

  <!-- ===================== body ===================== -->
  <div class="app-body" id="app-body" data-sidebar="expanded">

    <!-- ---------- input sidebar ---------- -->
    <aside class="sidebar" id="sidebar" aria-label="Incident input">
      <div class="sidebar__section">
        <span class="sidebar__label">
          <span class="sidebar__step" aria-hidden="true">1</span> Load an incident
        </span>
        <div id="mount-samples" class="stack-2"></div>
      </div>

      <div class="sidebar__section">
        <span class="sidebar__label">
          <span class="sidebar__step" aria-hidden="true">2</span> Evidence
        </span>
        <div id="mount-input"></div>
      </div>

      <div class="sidebar__section">
        <span class="sidebar__label">
          <span class="sidebar__step" aria-hidden="true">3</span> Analyse
        </span>
        <div id="mount-run"></div>
      </div>
    </aside>

    <!-- ---------- results workspace ---------- -->
    <main class="workspace">
      <nav class="tabstrip" role="tablist" id="tabstrip" aria-label="Analysis sections">
        <button class="tab" role="tab" id="tabbtn-summary" data-tab="summary"
                aria-selected="true" aria-controls="panel-summary">
          Summary
        </button>
        <button class="tab" role="tab" id="tabbtn-evidence" data-tab="evidence"
                aria-selected="false" aria-controls="panel-evidence">
          Evidence <span class="tab__count" data-count="evidence"></span>
        </button>
        <button class="tab" role="tab" id="tabbtn-timeline" data-tab="timeline"
                aria-selected="false" aria-controls="panel-timeline">
          Timeline <span class="tab__count" data-count="timeline"></span>
        </button>
        <button class="tab" role="tab" id="tabbtn-hypotheses" data-tab="hypotheses"
                aria-selected="false" aria-controls="panel-hypotheses">
          Hypotheses <span class="tab__count" data-count="hypotheses"></span>
        </button>
        <button class="tab" role="tab" id="tabbtn-risks" data-tab="risks"
                aria-selected="false" aria-controls="panel-risks">
          Reasoning risks <span class="tab__count" data-count="risks"></span>
        </button>
        <button class="tab" role="tab" id="tabbtn-actions" data-tab="actions"
                aria-selected="false" aria-controls="panel-actions">
          Next actions <span class="tab__count" data-count="actions"></span>
        </button>
        <button class="tab" role="tab" id="tabbtn-report" data-tab="report"
                aria-selected="false" aria-controls="panel-report">
          Postmortem
        </button>
      </nav>

      <div class="panes" id="panes">
        <section class="pane is-active" data-pane="summary" id="panel-summary"
                 role="tabpanel" aria-labelledby="tabbtn-summary" tabindex="0">
          <div class="pane__inner" id="pane-summary"></div>
        </section>
        <section class="pane" data-pane="evidence" id="panel-evidence"
                 role="tabpanel" aria-labelledby="tabbtn-evidence" tabindex="0">
          <div class="pane__inner" id="pane-evidence"></div>
        </section>
        <section class="pane" data-pane="timeline" id="panel-timeline"
                 role="tabpanel" aria-labelledby="tabbtn-timeline" tabindex="0">
          <div class="pane__inner" id="pane-timeline"></div>
        </section>
        <section class="pane" data-pane="hypotheses" id="panel-hypotheses"
                 role="tabpanel" aria-labelledby="tabbtn-hypotheses" tabindex="0">
          <div class="pane__inner" id="pane-hypotheses"></div>
        </section>
        <section class="pane" data-pane="risks" id="panel-risks"
                 role="tabpanel" aria-labelledby="tabbtn-risks" tabindex="0">
          <div class="pane__inner" id="pane-risks"></div>
        </section>
        <section class="pane" data-pane="actions" id="panel-actions"
                 role="tabpanel" aria-labelledby="tabbtn-actions" tabindex="0">
          <div class="pane__inner" id="pane-actions"></div>
        </section>
        <section class="pane" data-pane="report" id="panel-report"
                 role="tabpanel" aria-labelledby="tabbtn-report" tabindex="0">
          <div class="pane__inner" id="pane-report"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- ===================== status bar ===================== -->
  <footer class="statusbar" id="statusbar">
    <span class="statusbar__item">
      <span class="statusbar__dot" id="status-dot" data-tone="idle" aria-hidden="true"></span>
      <span id="status-state" role="status" aria-live="polite">Ready</span>
    </span>
    <span class="statusbar__spacer"></span>
    <span class="statusbar__item" id="status-grounding"></span>
    <span class="statusbar__item" id="status-model"></span>
    <span class="statusbar__item" id="status-duration"></span>
  </footer>
</div>

<div class="toast-host" id="toast-host" aria-live="polite"></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
