[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q --strict-markers

# The suite never calls a model provider. If a test ever needs to, mark it
# @pytest.mark.live and run it explicitly with -m live - it must not be part of
# the default run, because a test whose result depends on a network round-trip
# and a paid API is a weather report, not a test.
markers =
    live: hits a real model provider; excluded from the default run
